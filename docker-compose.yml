version: '3.8'

services:
  tmrl-trainer:
    build: .
    container_name: tmrl_trainer
    hostname: tmrl-trainer
    
    environment:
      - PYTHONUNBUFFERED=1
    
    volumes:
      - ./weights:/root/TmrlData/weights
      - ./checkpoints:/root/TmrlData/checkpoints
      - ./logs:/root/TmrlData/logs
      - ./dataset:/root/TmrlData/dataset
    
    ports:
      - "6666:6666"
      - "6668:6668"
    
    restart: unless-stopped
    
    extra_hosts:
      - "host.docker.internal:host-gateway"